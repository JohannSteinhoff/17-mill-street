<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printable Flyer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @page { size: letter; margin: 0; }
    :root { --ink: #17251f; --green: #1f4d3a; --green-2: #2f6b4f; --soft: #e6f0ea; --cream: #faf6ee; --amber: #e8a33d; --muted: #5c6b64; --line: #e4ddd0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #d9d4ca; font-family: Inter, system-ui, sans-serif; color: var(--ink); }

    .toolbar { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; padding: 12px 16px; background: var(--ink); color: #fff; font-size: .9rem; }
    .toolbar button, .toolbar a { font: 600 .9rem Inter, sans-serif; padding: 9px 14px; border-radius: 10px; border: 0; background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; }
    .toolbar button.primary { background: var(--amber); }
    .toolbar label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
    .hint { width: 100%; text-align: center; font-size: .8rem; opacity: .7; }
    .scaler { padding: 24px 16px; overflow-x: auto; }

    /* The page: fixed rows that always add up to exactly 11in */
    .page { width: 8.5in; height: 11in; margin: 0 auto; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.2); overflow: hidden;
            display: grid; grid-template-rows: 4.5in 4in 2.05in .45in; }
    .page.no-strip { grid-template-rows: 5.5in 5.05in 0 .45in; }
    .page > * { overflow: hidden; min-height: 0; }

    /* Hero */
    .hero { position: relative; background: linear-gradient(135deg, #cfe3d6, #f6e1bd); color: #fff; }
    .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(15, 30, 24, .92) 0%, rgba(15, 30, 24, .55) 38%, rgba(15, 30, 24, 0) 70%); }
    .hero > div { position: absolute; z-index: 1; }
    .badge { top: .35in; left: .45in; background: var(--amber); color: var(--ink); font-weight: 800; font-size: 10.5pt; letter-spacing: .12em; text-transform: uppercase; padding: 7px 14px; border-radius: 99px; }
    .price-tag { top: .3in; right: .45in; background: #fff; color: var(--green); border-radius: 14px; padding: 10px 16px 9px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    .price-tag b { display: block; font: 800 28pt/1 Fraunces, Georgia, serif; }
    .price-tag span { font-size: 9pt; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .hero-text { left: .45in; right: .45in; bottom: .3in; }
    .hero-text h1 { font: 800 38pt/1.03 Fraunces, Georgia, serif; margin: 0 0 8px; text-shadow: 0 2px 12px rgba(0,0,0,.3); }
    .hero-text p { margin: 0; font-size: 12.5pt; font-weight: 600; opacity: .95; }

    /* Info */
    .info { display: grid; grid-template-columns: 1fr 2.6in; gap: .3in; padding: .35in .45in .25in; }
    .stats { display: grid; grid-template-columns: repeat(4, auto); border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: .2in; }
    .stat { padding: 8px 10px; border-left: 1.5px solid var(--line); }
    .stat:first-child { border-left: 0; }
    .stat small { display: block; font-size: 7.5pt; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .stat b { font-size: 11.5pt; white-space: nowrap; }
    h2 { font: 700 13pt Fraunces, Georgia, serif; margin: 0 0 8px; color: var(--green); }
    .checks { list-style: none; margin: 0 0 .22in; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 11.5pt; line-height: 1.3; }
    .checks li { display: flex; gap: 7px; }
    .checks li::before { content: "✓"; flex: none; width: 17px; height: 17px; border-radius: 50%; background: var(--soft); color: var(--green-2); font-weight: 800; font-size: 9pt; display: grid; place-items: center; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { background: var(--cream); border: 1px solid var(--line); font-size: 9pt; font-weight: 600; padding: 4px 10px; border-radius: 99px; }

    .qr-card { background: var(--green); color: #fff; border-radius: 16px; padding: .17in .18in; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .qr-card .scan { font-weight: 800; letter-spacing: .14em; font-size: 10pt; color: #f6d9a8; }
    .qr-card .qr { background: #fff; padding: 8px; border-radius: 10px; margin: 8px 0; }
    .qr-card .qr img, .qr-card .qr canvas { width: 1.75in !important; height: 1.75in !important; display: block; }
    .qr-card p { margin: 0; font-size: 9pt; line-height: 1.35; opacity: .9; }
    .qr-card .call { margin-top: auto; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.25); width: 100%; }
    .qr-card .call b { display: block; font-size: 14pt; color: #fff; opacity: 1; }

    /* Photo strip */
    .strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; padding: 0 .45in .25in; }
    .strip figure { margin: 0; position: relative; border-radius: 10px; overflow: hidden; background: #fff; border: 1px solid var(--line); }
    .strip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .strip img.contain { object-fit: contain; padding: 4px; }
    .strip figcaption { position: absolute; left: 6px; bottom: 6px; background: rgba(23, 37, 31, .82); color: #fff; font-size: 7.5pt; font-weight: 600; padding: 2px 7px; border-radius: 99px; }


    .foot { background: var(--green); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 .45in; font-size: 10pt; font-weight: 600; }
    .foot b { color: #f6d9a8; }

    @media print {
      html, body { background: #fff; width: 8.5in; height: 11in; }
      .toolbar { display: none; }
      .scaler { padding: 0; overflow: visible; }
      .page { box-shadow: none; margin: 0; break-after: avoid; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="primary" onclick="print()">🖨️ Print / Save as PDF</button>
    <button id="png">⬇️ Download as image</button>
    <label><input type="checkbox" id="strip" checked> Photo strip</label>
    <a href="kit.html">← Marketing kit</a>
    <div class="hint">When printing: Paper size Letter · Margins None · Scale 100% · turn on Background graphics</div>
  </div>
  <div class="scaler"><div class="page" id="page"></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
  (async () => {
    const L = await loadListing();
    const url = siteUrl(L);
    const photos = L.photos || [];
    const cover = photos[0];
    const strip = photos.slice(1, 4);
    const a = L.address;
    const amenities = (L.amenities || []).slice(0, 4);


    $("#page").innerHTML = `
      <section class="hero">
        ${cover ? `<img src="${esc(cover.src)}" alt="">` : ""}
        <div class="badge">Lease takeover</div>
        <div class="price-tag"><b>${esc(clean(L.rent).replace(/\/mo.*$/, ""))}</b><span>per month</span></div>
        <div class="hero-text">
          <h1>${esc(clean(L.headline))}</h1>
          <p>📍 ${esc(clean(a.street))} · ${esc(clean(a.city))}, ${esc(clean(a.state))} · ${esc(clean(a.neighborhood))}</p>
        </div>
      </section>

      <section class="info">
        <div>
          <div class="stats">
            <div class="stat"><small>Layout</small><b>${esc(clean(L.bedrooms))} bd / ${esc(clean(L.bathrooms))} ba</b></div>
            <div class="stat"><small>Size</small><b>${esc(clean(L.sqft))} sq ft</b></div>
            <div class="stat"><small>Move in</small><b>${esc(clean(L.available))}</b></div>
            <div class="stat"><small>Lease ends</small><b>${esc(clean(L.lease_ends))}</b></div>
          </div>
          <h2>Why you'll love it</h2>
          <ul class="checks">${(L.highlights || []).slice(0, 4).map((h) => `<li>${esc(clean(h))}</li>`).join("")}</ul>
          ${amenities.length ? `<h2>Amenities</h2><div class="chips">${amenities.map((x) => `<span class="chip">${esc(clean(x))}</span>`).join("")}</div>` : ""}
        </div>
        <div class="qr-card">
          <div class="scan">SCAN ME</div>
          <div class="qr" id="qr"></div>
          <p>All photos, floor plan,<br>costs &amp; FAQ</p>
          <div class="call"><p>Questions? Text ${esc(clean(L.contact.name))}</p><b>${esc(clean(L.contact.phone))}</b></div>
        </div>
      </section>

      <section class="strip">${strip.map((p) => `<figure><img src="${esc(p.src)}" alt=""${p.fit === "contain" ? ' class="contain"' : ""}>${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ""}</figure>`).join("")}</section>

      <footer class="foot"><span>🔗 ${esc(url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</span><span>Text ${esc(clean(L.contact.name))} · <b>${esc(clean(L.contact.phone))}</b></span></footer>`;

    renderQR($("#qr"), url, 400);

    const page = $("#page");
    if (!strip.length) { page.classList.add("no-strip"); $("#strip").checked = false; $("#strip").disabled = true; }
    $("#strip").onchange = (e) => page.classList.toggle("no-strip", !e.target.checked);
    $("#png").onclick = () => exportPng(page, "17-mill-street-flyer.png", 3);
  })();
  </script>
</body>
</html>
