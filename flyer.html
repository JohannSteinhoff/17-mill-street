<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printable Flyer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <style>
    /* Swiss poster style: one grid, flush-left type, black ink + one red accent, no decoration. */
    @page { size: letter; margin: 0; }
    :root { --ink: #111; --red: #d7301f; --gray: #6b6b6b; --rule: #111; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #d9d6d0; font-family: Archivo, "Helvetica Neue", Arial, sans-serif; color: var(--ink); }

    .toolbar { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; padding: 12px 16px; background: #111; color: #fff; font-size: .9rem; }
    .toolbar button, .toolbar a { font: 600 .9rem Archivo, sans-serif; padding: 9px 14px; border-radius: 6px; border: 0; background: #fff; color: #111; cursor: pointer; text-decoration: none; }
    .toolbar button.primary { background: var(--red); color: #fff; }
    .hint { width: 100%; text-align: center; font-size: .8rem; opacity: .7; }
    .scaler { padding: 24px 16px; overflow-x: auto; }

    .page { width: 8.5in; height: 11in; margin: 0 auto; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.18); overflow: hidden;
            padding: .45in .5in .4in; display: grid; grid-template-rows: auto auto 1fr auto auto; row-gap: .2in; }
    .page > * { min-height: 0; }

    .top { display: flex; justify-content: space-between; font-size: 9pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-bottom: 2.5px solid var(--rule); padding-bottom: 6px; }

    h1 { margin: 0; font-weight: 900; font-stretch: 72%; font-size: 62pt; line-height: .92; letter-spacing: -.01em; }
    h1 .light { display: block; font-weight: 400; }

    /* Photo + price */
    .feature { display: grid; grid-template-columns: 1fr 2.45in; column-gap: .25in; min-height: 0; }
    .photo { position: relative; min-height: 0; background: #eee; }
    .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .price { display: flex; flex-direction: column; border-top: 1px solid var(--rule); padding-top: 8px; }
    .price .was { font-weight: 800; font-stretch: 70%; font-size: 40pt; line-height: 1; color: #8a8a8a; }
    .price .was s { text-decoration: none; position: relative; }
    .price .was s::after { content: ""; position: absolute; left: -3%; right: -3%; top: 52%; height: 5px; background: var(--ink); transform: rotate(-7deg); }
    .price .save { display: inline-block; align-self: flex-start; margin-top: 6px; background: var(--red); color: #fff; font-size: 9.5pt; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; }
    .price .now { font-weight: 900; font-stretch: 70%; font-size: 74pt; line-height: .85; color: var(--red); margin: 2px 0 4px; }
    .price .now small { font-size: 20pt; font-weight: 700; }
    .price .per { font-size: 10.5pt; font-weight: 600; }
    .dates { margin: auto 0 0; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 3px; font-size: 10.5pt; border-top: 1px solid var(--rule); padding-top: 8px; }
    .dates dt { color: var(--gray); }
    .dates dd { margin: 0; font-weight: 700; }

    /* Specs + floor plan */
    .details { display: grid; grid-template-columns: 1fr 2.45in; column-gap: .25in; }
    .specs { margin: 0; align-self: start; }
    .specs div { display: grid; grid-template-columns: 1.15in 1fr; border-top: 1px solid var(--rule); padding: 9px 0 10px; font-size: 11.5pt; line-height: 1.25; }
    .specs div:last-child { border-bottom: 1px solid var(--rule); }
    .specs dt { font-size: 8.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding-top: 2px; }
    .specs dd { margin: 0; font-weight: 600; }

    .plan { position: relative; }
    .plan .label { font-size: 8.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; border-top: 1px solid var(--rule); padding-top: 6px; }
    .plan .box { position: relative; width: 2.05in; aspect-ratio: 774 / 1047; margin: .5in auto 0; }
    .plan .box img { width: 100%; height: 100%; display: block; }
    .plan svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .note { position: absolute; z-index: 2; right: 0; top: .2in; width: 1.9in; font-family: "Nanum Pen Script", cursive; font-size: 18pt; line-height: .85; color: var(--red); transform: rotate(-4deg); text-align: right; }

    /* Contact */
    .contact { display: grid; grid-template-columns: auto 1fr; column-gap: .22in; align-items: center; border-top: 2.5px solid var(--rule); padding-top: .14in; }
    .contact .qr img, .contact .qr canvas { width: 1.05in !important; height: 1.05in !important; display: block; }
    .contact .scan { font-size: 9pt; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .contact .phone { font-weight: 900; font-stretch: 75%; font-size: 30pt; line-height: 1; margin: 3px 0; }
    .contact .url { font-size: 9.5pt; color: var(--gray); }

    @media print {
      html, body { background: #fff; width: 8.5in; height: 11in; }
      .toolbar { display: none; }
      .scaler { padding: 0; overflow: visible; }
      .page { box-shadow: none; margin: 0; break-after: avoid; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="primary" onclick="print()">🖨️ Print / Save as PDF</button>
    <button id="png">⬇️ Download as image</button>
    <a href="kit.html">← Marketing kit</a>
    <div class="hint">When printing: Paper size Letter · Margins None · Scale 100%</div>
  </div>
  <div class="scaler"><div class="page" id="page"></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
  (async () => {
    const L = await loadListing();
    const url = siteUrl(L);
    const plan = floorPlan(L);
    const cover = (L.photos || []).find((p) => p !== plan);
    const a = L.address;
    const cost = (re) => ((L.costs || []).find((c) => re.test(c.label)) || {}).value;
    const policy = (re) => ((L.policies || []).find((c) => re.test(c.label)) || {}).value;
    const short = (d) => clean(d).replace(/^(\w{3})\w*/, "$1"); // "December 1, 2026" -> "Dec 1, 2026"

    // "Your own 1-bedroom. No roommates." -> bold first sentence, light second
    const [h1a, ...h1b] = clean(L.headline).split(/(?<=\.)\s+/);

    const specs = [
      ["Campus", L.commute],
      ["Furniture", L.furnished],
      ["Deposit", cost(/deposit/i)],
      ["Fees", cost(/fee/i)],
      ["Included", (L.included || []).map(clean).join(", ")],
      ["Pets", policy(/pet/i)],
      ["Amenities", (L.amenities || []).slice(0, 3).map(clean).join(", ")],
    ].filter(([, v]) => v);

    $("#page").innerHTML = `
      <div class="top"><span>For rent · ${esc(clean(a.city))}, ${esc(clean(a.state))}</span><span>${esc(clean(a.street))}</span></div>

      <h1>${esc(h1a).replace(/(\d+-\w+)/, '<span style="white-space:nowrap">$1</span>')}${h1b.length ? `<span class="light">${esc(h1b.join(" "))}</span>` : ""}</h1>

      <section class="feature">
        <div class="photo">${cover ? `<img src="${esc(cover.src)}" alt="">` : ""}</div>
        <div class="price">
          ${L.rent_original ? `<div class="was"><s>${esc(wasPrice(L))}</s></div>` : ""}
          <div class="now">${esc(clean(L.rent).replace(/\/mo.*$/, ""))}<small>/mo</small></div>
          <div class="per">for the whole apartment</div>
          ${L.rent_original ? `<div class="save">Discounted · save ${esc(savings(L))}/mo</div>` : ""}
          <dl class="dates">
            <dt>Move in</dt><dd>${esc(short(L.available))}</dd>
            <dt>Lease ends</dt><dd>${esc(short(L.lease_ends))}</dd>
          </dl>
        </div>
      </section>

      <section class="details">
        <dl class="specs">${specs.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(clean(v))}</dd></div>`).join("")}</dl>
        ${plan ? `
        <div class="plan">
          <div class="label">Floor plan · ${esc(clean(L.sqft))} sq ft</div>
          ${L.star_feature_short ? `<div class="note">${esc(clean(L.star_feature_short))}</div>` : ""}
          <div class="box">
            <img src="${esc(plan.src)}" alt="Floor plan">
            ${L.star_feature_short ? `
            <svg viewBox="0 0 100 135" preserveAspectRatio="none" aria-hidden="true">
              <path d="M 14 31 C 18 24, 36 22, 41 27 C 46 33, 40 41, 27 42 C 15 43, 10 38, 12 33 C 13 30, 17 28, 21 28"
                    fill="none" stroke="#d7301f" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M 50 -2 C 50 9, 47 17, 41 23" fill="none" stroke="#d7301f" stroke-width="1.2" stroke-linecap="round"/>
              <path d="M 41 23 L 41.5 17.5 M 41 23 L 46.5 21" fill="none" stroke="#d7301f" stroke-width="1.2" stroke-linecap="round"/>
            </svg>` : ""}
          </div>
        </div>` : ""}
      </section>

      <section class="contact">
        <div class="qr" id="qr"></div>
        <div>
          <div class="scan">Scan for photos, costs + FAQ — or text us</div>
          <div class="phone">${esc(clean(L.contact.phone))}</div>
          <div class="url">${esc(url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</div>
        </div>
      </section>`;

    renderQR($("#qr"), url, 400);
    $("#png").onclick = () => exportPng($("#page"), "1701-mill-street-flyer.png", 3);
  })();
  </script>
</body>
</html>
