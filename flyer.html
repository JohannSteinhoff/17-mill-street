<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printable Flyer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @page { size: letter; margin: 0; }
    :root { --ink: #17251f; --green: #1f4d3a; --green-2: #2f6b4f; --soft: #e6f0ea; --cream: #faf6ee; --amber: #e8a33d; --muted: #5c6b64; --line: #e4ddd0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #d9d4ca; font-family: Inter, system-ui, sans-serif; color: var(--ink); }

    .toolbar { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; padding: 12px 16px; background: var(--ink); color: #fff; font-size: .9rem; }
    .toolbar button, .toolbar a { font: 600 .9rem Inter, sans-serif; padding: 9px 14px; border-radius: 10px; border: 0; background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; }
    .toolbar button.primary { background: var(--amber); }
    .hint { width: 100%; text-align: center; font-size: .8rem; opacity: .7; }
    .scaler { padding: 24px 16px; overflow-x: auto; }

    /* The page: fixed rows that always add up to exactly 11in */
    .page { width: 8.5in; height: 11in; margin: 0 auto; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.2); overflow: hidden;
            display: grid; grid-template-rows: 3.6in 6.95in .45in; }
    .page > * { overflow: hidden; min-height: 0; }

    /* Hero */
    .hero { position: relative; background: linear-gradient(135deg, #cfe3d6, #f6e1bd); color: #fff; }
    .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(15, 30, 24, .92) 0%, rgba(15, 30, 24, .55) 42%, rgba(15, 30, 24, 0) 75%); }
    .hero > div { position: absolute; z-index: 1; }
    .badge { top: .32in; left: .45in; background: var(--amber); color: var(--ink); font-weight: 800; font-size: 10.5pt; letter-spacing: .12em; text-transform: uppercase; padding: 7px 14px; border-radius: 99px; }
    .price-tag { top: .28in; right: .45in; background: #fff; color: var(--green); border-radius: 14px; padding: 10px 16px 9px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    .price-tag b { display: block; font: 800 28pt/1 Fraunces, Georgia, serif; }
    .price-tag span { font-size: 9pt; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .hero-text { left: .45in; right: .45in; bottom: .28in; }
    .hero-text h1 { font: 800 34pt/1.03 Fraunces, Georgia, serif; margin: 0 0 8px; text-shadow: 0 2px 12px rgba(0,0,0,.3); }
    .hero-text p { margin: 0; font-size: 12pt; font-weight: 600; opacity: .95; }

    /* Body: details on the left, floor plan + QR on the right */
    .main { display: grid; grid-template-columns: 1fr 3.3in; gap: .28in; padding: .3in .45in .28in; }
    .col { display: flex; flex-direction: column; min-height: 0; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: .2in; }
    .stat { padding: 8px 12px; }
    .stat:nth-child(even) { border-left: 1.5px solid var(--line); }
    .stat:nth-child(n+3) { border-top: 1.5px solid var(--line); }
    .stat small { display: block; font-size: 7.5pt; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .stat b { font-size: 12.5pt; white-space: nowrap; }
    h2 { font: 700 13pt Fraunces, Georgia, serif; margin: 0 0 7px; color: var(--green); }
    .checks { list-style: none; margin: 0 0 .18in; padding: 0; display: grid; gap: 6px; font-size: 11pt; line-height: 1.3; }
    .checks li { display: flex; gap: 8px; }
    .checks li::before { content: "✓"; flex: none; width: 17px; height: 17px; border-radius: 50%; background: var(--soft); color: var(--green-2); font-weight: 800; font-size: 9pt; display: grid; place-items: center; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: .2in; }
    .chip { background: var(--cream); border: 1px solid var(--line); font-size: 9pt; font-weight: 600; padding: 4px 10px; border-radius: 99px; }
    .minis { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
    .minis figure { margin: 0; position: relative; border-radius: 10px; overflow: hidden; }
    .minis img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .minis figcaption { position: absolute; left: 6px; bottom: 6px; background: rgba(23, 37, 31, .82); color: #fff; font-size: 7.5pt; font-weight: 600; padding: 2px 7px; border-radius: 99px; }

    .plan { flex: 1; min-height: 0; display: flex; flex-direction: column; border: 2px solid var(--green); border-radius: 16px; overflow: hidden; margin-bottom: .16in; }
    .plan-head { background: var(--green); color: #fff; padding: 8px 14px; display: flex; justify-content: space-between; align-items: baseline; }
    .plan-head b { font: 700 14pt Fraunces, Georgia, serif; }
    .plan-head span { font-size: 9.5pt; font-weight: 700; color: #f6d9a8; }
    .plan-img { flex: 1; min-height: 0; position: relative; background: #fff; }
    .plan-img img { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); object-fit: contain; }

    .plan-star { background: var(--amber); color: var(--ink); font-weight: 700; font-size: 10pt; line-height: 1.3; padding: 8px 12px; }
    .qr-card { background: var(--cream); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px; display: flex; gap: 12px; align-items: center; }
    .qr-card .qr { background: #fff; padding: 6px; border-radius: 8px; flex: none; }
    .qr-card .qr img, .qr-card .qr canvas { width: 1.2in !important; height: 1.2in !important; display: block; }
    .qr-card .scan { font-weight: 800; letter-spacing: .12em; font-size: 10pt; color: var(--green); }
    .qr-card p { margin: 4px 0 0; font-size: 9.5pt; line-height: 1.35; color: var(--muted); }

    .foot { background: var(--green); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 .45in; font-size: 10pt; font-weight: 600; }
    .foot b { color: #f6d9a8; }

    @media print {
      html, body { background: #fff; width: 8.5in; height: 11in; }
      .toolbar { display: none; }
      .scaler { padding: 0; overflow: visible; }
      .page { box-shadow: none; margin: 0; break-after: avoid; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="primary" onclick="print()">🖨️ Print / Save as PDF</button>
    <button id="png">⬇️ Download as image</button>
    <a href="kit.html">← Marketing kit</a>
    <div class="hint">When printing: Paper size Letter · Margins None · Scale 100% · turn on Background graphics</div>
  </div>
  <div class="scaler"><div class="page" id="page"></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
  (async () => {
    const L = await loadListing();
    const url = siteUrl(L);
    const plan = floorPlan(L);
    const photos = (L.photos || []).filter((p) => p !== plan);
    const cover = photos[0];
    const minis = photos.slice(1, 3);
    const a = L.address;
    const amenities = (L.amenities || []).slice(0, 4);

    $("#page").innerHTML = `
      <section class="hero">
        ${cover ? `<img src="${esc(cover.src)}" alt="">` : ""}
        <div class="badge">Lease takeover</div>
        <div class="price-tag"><b>${esc(clean(L.rent).replace(/\/mo.*$/, ""))}</b><span>per month</span></div>
        <div class="hero-text">
          <h1>${esc(clean(L.headline))}</h1>
          <p>📍 ${esc(clean(a.street))} · ${esc(clean(a.city))}, ${esc(clean(a.state))} · ${esc(clean(a.neighborhood))}</p>
        </div>
      </section>

      <section class="main">
        <div class="col">
          <div class="stats">
            <div class="stat"><small>Layout</small><b>${esc(clean(L.bedrooms))} bed / ${esc(clean(L.bathrooms))} bath</b></div>
            <div class="stat"><small>Size</small><b>${esc(clean(L.sqft))} sq ft</b></div>
            <div class="stat"><small>Move in</small><b>${esc(clean(L.available))}</b></div>
            <div class="stat"><small>Lease ends</small><b>${esc(clean(L.lease_ends))}</b></div>
          </div>
          <h2>Why you'll love it</h2>
          <ul class="checks">${(L.highlights || []).slice(0, 4).map((h) => `<li>${esc(clean(h))}</li>`).join("")}</ul>
          ${amenities.length ? `<h2>Amenities</h2><div class="chips">${amenities.map((x) => `<span class="chip">${esc(clean(x))}</span>`).join("")}</div>` : ""}
          ${minis.length ? `<div class="minis">${minis.map((p) => `<figure><img src="${esc(p.src)}" alt="">${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ""}</figure>`).join("")}</div>` : ""}
        </div>
        <div class="col">
          ${plan ? `
          <div class="plan">
            <div class="plan-head"><b>Floor plan</b><span>${esc(clean(L.bedrooms))} bed · ${esc(clean(L.bathrooms))} bath · ${esc(clean(L.sqft))} sq ft</span></div>
            <div class="plan-img"><img src="${esc(plan.src)}" alt="Floor plan"></div>
            ${L.star_feature ? `<div class="plan-star">🧺 ${esc(clean(L.star_feature))}</div>` : ""}
          </div>` : ""}
          <div class="qr-card">
            <div class="qr" id="qr"></div>
            <div>
              <div class="scan">SCAN ME</div>
              <p>All photos, costs, FAQ &amp; how the lease takeover works</p>
            </div>
          </div>
        </div>
      </section>

      <footer class="foot"><span>🔗 ${esc(url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</span><span>Questions? Text ${esc(clean(L.contact.name))} · <b>${esc(clean(L.contact.phone))}</b></span></footer>`;

    renderQR($("#qr"), url, 400);
    $("#png").onclick = () => exportPng($("#page"), "17-mill-street-flyer.png", 3);
  })();
  </script>
</body>
</html>
