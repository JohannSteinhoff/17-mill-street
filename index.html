<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>1701 Mill Street Apartment</title>
  <meta name="description" content="Fully furnished 1 bedroom apartment at 1701 Mill Street, San Marcos, near Texas State University.">
  <link rel="alternate" type="application/json" href="listing.json" title="Full listing data (machine readable)">
  <link rel="alternate" type="text/plain" href="llms.txt" title="Guide for AI assistants">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23d7301f'/><text x='50' y='72' font-size='64' font-family='Arial' font-weight='900' text-anchor='middle' fill='white'>1</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="./" id="brand">1701 Mill Street</a>
      <span class="pill" id="where">For rent</span>
    </header>

    <main id="app">
      <noscript>
        <p>This page needs JavaScript to display. All listing details are also available as plain data in <a href="listing.json">listing.json</a>.</p>
      </noscript>
    </main>

    <footer id="footer"></footer>
  </div>

  <div class="sticky" id="sticky"></div>
  <div class="lightbox" id="lightbox"><figure><img alt=""><p></p></figure></div>
  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
  (async () => {
    const L = await loadListing();
    const url = siteUrl(L);
    const c = L.contact;
    const a = L.address;
    const smsBody = `Hi ${clean(c.name)}! I'm interested in the apartment at ${clean(a.street)}.`;
    const mail = `mailto:${clean(c.email)}?subject=${encodeURIComponent("Apartment at " + clean(a.street))}&body=${encodeURIComponent(smsBody)}`;
    const plan = floorPlan(L);
    const gallery = (L.photos || []).filter((p) => p !== plan); // floor plan has its own section
    const cover = gallery[0];
    const short = (d) => clean(d).replace(/^(\w{3})\w*/, "$1"); // "December 1, 2026" -> "Dec 1, 2026"
    const pairs = (arr) => (arr || []).map((x) => [x.label, x.value]);
    const [h1a, ...h1b] = clean(L.headline).split(/(?<=\.)\s+/);
    let n = 0;
    const section = (title, body) => `
      <section class="section">
        <div class="label"><b>${String(++n).padStart(2, "0")}</b>${title}</div>
        <div>${body}</div>
      </section>`;

    const specs = [
      ["Layout", `${clean(L.bedrooms)} bed / ${clean(L.bathrooms)} bath · ${clean(L.sqft)} sq ft`],
      ["Furniture", L.furnished],
      ["Campus", L.commute],
      ...pairs(L.costs),
      ["Included", (L.included || []).map(clean).join(", ")],
      ...pairs(L.policies),
      ["Amenities", (L.amenities || []).map(clean).join(", ")],
    ].filter(([, v]) => v);

    document.title = `${clean(a.street)} · ${clean(L.rent)} · 1 bedroom apartment`;
    $("#where").textContent = `For rent · ${clean(a.city)}, ${clean(a.state)}`;

    $("#app").innerHTML = `
      <h1 class="headline">${esc(h1a).replace(/(\d+-\w+)/, '<span class="nowrap">$1</span>')}${h1b.length ? `<span class="light">${esc(h1b.join(" "))}</span>` : ""}</h1>
      <p class="subline">
        ${L.commute ? `<span>${esc(clean(L.commute))}</span>` : ""}
        <span>${esc(clean(a.street))}, ${esc(clean(a.city))} · ${esc(clean(a.neighborhood))}</span>
      </p>

      <section class="hero">
        <div class="hero-img">${cover ? `<img src="${esc(cover.src)}" alt="${esc(cover.caption || "Apartment photo")}">` : ""}</div>
        <div class="rent">
          ${L.rent_original ? `<div class="was"><s>${esc(wasPrice(L))}</s></div>` : ""}
          <div class="now">${esc(clean(L.rent).replace(/\/mo.*$/, ""))}<small>/mo</small></div>
          <div class="per">for the whole apartment</div>
          ${L.rent_original ? `<div class="save">Discounted · save ${esc(savings(L))}/mo</div>` : ""}
          <dl class="dates">
            <dt>Move in</dt><dd>${esc(short(L.available))}</dd>
            <dt>Lease ends</dt><dd>${esc(short(L.lease_ends))}</dd>
          </dl>
          <div class="actions">
            <a class="btn primary" href="${smsHref(c.phone, smsBody)}">Text ${esc(clean(c.name))}</a>
            <a class="btn" href="${mail}">Email</a>
            <button class="btn" id="share">Share</button>
          </div>
        </div>
      </section>

      ${plan ? section("Floor plan", `
        <div class="plan-wrap">
          <div class="plan">
            ${L.star_feature_short ? `<div class="note">${esc(clean(L.star_feature_short))}</div>` : ""}
            <div class="box" id="planImg" title="View full size">
              <img src="${esc(plan.src)}" alt="Floor plan">
              ${L.star_feature_short ? `
              <svg viewBox="0 0 100 135" preserveAspectRatio="none" aria-hidden="true">
                <path d="M 14 31 C 18 24, 36 22, 41 27 C 46 33, 40 41, 27 42 C 15 43, 10 38, 12 33 C 13 30, 17 28, 21 28"
                      fill="none" stroke="#d7301f" stroke-width="1.2" stroke-linecap="round"/>
                <path d="M 50 -2 C 50 9, 47 17, 41 23" fill="none" stroke="#d7301f" stroke-width="1" stroke-linecap="round"/>
                <path d="M 41 23 L 41.5 17.5 M 41 23 L 46.5 21" fill="none" stroke="#d7301f" stroke-width="1" stroke-linecap="round"/>
              </svg>` : ""}
            </div>
          </div>
          <div class="plan-meta">
            <h2>${esc(clean(L.bedrooms))} bed / ${esc(clean(L.bathrooms))} bath<br>${esc(clean(L.sqft))} sq ft</h2>
            <p>${esc(clean(L.tagline))}</p>
            <button class="btn small" id="planOpen">View full size</button>
          </div>
        </div>`) : ""}

      ${section("Details", `
        ${(L.highlights || []).length ? `<ul class="points">${L.highlights.map((h) => `<li>${esc(clean(h))}</li>`).join("")}</ul>` : ""}
        <dl class="specs">${specs.map(([k, v]) => `<div><dt>${esc(clean(k))}</dt><dd>${esc(clean(v))}</dd></div>`).join("")}</dl>`)}

      ${gallery.length > 1 ? section("Photos", `
        <div class="gallery">${gallery.map((p, i) => `
          <figure>
            <button data-i="${i}" aria-label="Open photo: ${esc(p.caption || "")}"><img loading="lazy" src="${esc(p.src)}" alt="${esc(p.caption || "Apartment photo")}"></button>
            <figcaption><b>${String(i + 1).padStart(2, "0")}</b>${esc(p.caption || "")}</figcaption>
          </figure>`).join("")}</div>`) : ""}

      ${section("How it works", `<ol class="steps">${(L.how_it_works || []).map((s) => `<li>${esc(clean(s))}</li>`).join("")}</ol>`)}

      ${section("Location", `
        <h2>${esc(fullAddress(L))}</h2>
        <ul class="points">${(L.neighborhood || []).map((x) => `<li>${esc(clean(x))}</li>`).join("")}</ul>
        <a class="btn small" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fullAddress(L))}" target="_blank" rel="noopener">Open in Google Maps</a>`)}

      ${section("Questions", (L.faq || []).map((f) => `<details><summary>${esc(clean(f.q))}</summary><p>${esc(clean(f.a))}</p></details>`).join(""))}

      ${section("Contact", `
        <div class="contact-grid">
          <div>
            <p style="margin:0">${esc(clean(c.preferred))}. ${esc(clean(c.hours))}.</p>
            <a class="phone" href="${smsHref(c.phone, smsBody)}">${esc(clean(c.phone))}</a>
            <div class="actions">
              <a class="btn primary" href="${smsHref(c.phone, smsBody)}">Text ${esc(clean(c.name))}</a>
              <a class="btn" href="${telHref(c.phone)}">Call</a>
              <a class="btn" href="${mail}">${esc(clean(c.email))}</a>
            </div>
          </div>
          <div class="qr-box"><div id="qr"></div><p>Open this page on your phone</p></div>
        </div>`)}`;

    $("#sticky").innerHTML = `
      <a class="btn primary" href="${smsHref(c.phone, smsBody)}">Text</a>
      <a class="btn" href="${telHref(c.phone)}">Call</a>
      <button class="btn" id="share2">Share</button>`;

    $("#footer").innerHTML = `<span>${esc(fullAddress(L))}</span>
      <span><a href="listing.json">Listing data (JSON)</a> · <a href="llms.txt">For AI assistants</a> · <a href="kit.html">Marketing kit</a></span>`;

    renderQR($("#qr"), url, 280);

    const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); };
    const share = async () => {
      if (navigator.share) { try { await navigator.share({ title: document.title, text: texts.short(L), url }); } catch {} }
      else { await copyText(url); toast("Link copied!"); }
    };
    $("#share").onclick = share;
    $("#share2").onclick = share;

    const lb = $("#lightbox");
    const open = (p) => { $("img", lb).src = p.src; $("p", lb).textContent = p.caption || ""; lb.classList.add("open"); };
    $$(".gallery button").forEach((b) => b.onclick = () => open(gallery[b.dataset.i]));
    lb.onclick = () => lb.classList.remove("open");
    if (plan) $("#planOpen").onclick = $("#planImg").onclick = () => open(plan);

    // Structured data for search engines & AI crawlers that run JavaScript.
    const ld = document.createElement("script");
    ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org", "@type": "Apartment", name: clean(L.headline), description: clean(L.tagline), url,
      numberOfRooms: clean(L.bedrooms), numberOfBathroomsTotal: clean(L.bathrooms),
      floorSize: { "@type": "QuantitativeValue", value: clean(L.sqft), unitCode: "FTK" },
      address: { "@type": "PostalAddress", streetAddress: clean(a.street), addressLocality: clean(a.city), addressRegion: clean(a.state), postalCode: clean(a.zip) },
      image: (L.photos || []).map((p) => url + p.src),
    });
    document.head.appendChild(ld);
  })().catch((e) => {
    $("#app").innerHTML = `<p>Couldn't load the listing (${esc(e.message)}). If you opened this file directly, run a local server instead. See README.md.</p>`;
  });
  </script>
</body>
</html>
